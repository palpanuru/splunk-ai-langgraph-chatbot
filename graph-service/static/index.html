<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splunk AI Log Search</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5e7eb;background:#0b1220}
*{box-sizing:border-box}body{margin:0;display:flex;justify-content:center;padding:32px}
main{width:min(850px,100%);background:#151e30;border:1px solid #344156;border-radius:16px;padding:24px}
h1{margin:0 0 8px}p{color:#aebdd1}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}
input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #53627b}
input,select{background:#0b1220;color:#fff}#search{flex:1;min-width:190px}
button{background:#2668ce;color:#fff;cursor:pointer}button:disabled{opacity:.5}
.messages{height:360px;overflow:auto;background:#0b1220;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{padding:12px;border-radius:10px;white-space:pre-wrap;max-width:90%}
.bot{background:#27344a;align-self:flex-start}.user{background:#2157a1;align-self:flex-end}
form{display:flex;gap:8px;margin-top:16px}#message{flex:1;min-width:0}small{color:#9aacc4}
</style>
</head>
<body><main>
<h1>Splunk AI Log Search</h1>
<p>Search recent Splunk logs across indexes accessible to your Splunk token. No service restriction.</p>
<div class="toolbar">
<label for="search">Search text</label><input id="search" maxlength="120" placeholder="Optional: timeout, exception, trace ID">
<label for="minutes">Last</label><select id="minutes"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">60 min</option></select>
<small id="status">Ready</small><button type="button" id="newChat">New chat</button>
</div>
<section class="messages" id="messages" aria-live="polite"><div class="bubble bot">Ask a question about logs. Optionally enter exact log text above. Leave it blank to retrieve the latest events.</div></section>
<form id="form"><input id="message" maxlength="1000" placeholder="What caused the errors?" required autocomplete="off"><button id="send" type="submit">Send</button></form>
</main>
<script>
let sessionId=null;
const messages=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('message'),send=document.getElementById('send'),status=document.getElementById('status');
function add(text,who){const div=document.createElement('div');div.className='bubble '+who;div.textContent=text;messages.appendChild(div);messages.scrollTop=messages.scrollHeight;return div;}
document.getElementById('newChat').addEventListener('click',()=>{sessionId=null;messages.replaceChildren();add('New conversation started.','bot');});
form.addEventListener('submit',async(e)=>{
e.preventDefault();const message=input.value.trim();if(!message)return;
add(message,'user');input.value='';send.disabled=true;status.textContent='Searching...';
const placeholder=add('Searching Splunk and analyzing events...','bot');
try{
const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,search_text:document.getElementById('search').value.trim(),minutes:Number(document.getElementById('minutes').value),session_id:sessionId})});
const data=await response.json();
if(response.ok){sessionId=data.session_id;placeholder.textContent=data.answer+'\n\nEvents: '+data.event_count+' | Steps: '+data.steps.join(' → ');}
else{placeholder.textContent='Error: '+(data.detail||response.status);}
}catch(err){placeholder.textContent='Unable to connect to chatbot.';}
finally{send.disabled=false;status.textContent='Ready';input.focus();}
});
</script></body></html>
